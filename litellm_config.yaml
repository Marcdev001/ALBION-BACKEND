# =============================================================================
# Albion Proxy - LiteLLM Configuration
# =============================================================================
#
# HOW THIS INTEGRATES WITH server.js:
# 1. This optional LiteLLM deployment uses the same exact DeepInfra model IDs.
# 2. The ALBION server currently routes directly to DeepInfra.
# 3. Provider credentials remain in environment secrets.
#
# AUTONOMOUS BILLING SAFETY:
# DeepInfra charges the connected card automatically.
# server.js enforces pre-request cap checks BEFORE calling this proxy.
# LiteLLM tracks spend per user/session for reconciliation.
# max_budget acts as a hard ceiling safety net.
# =============================================================================

model_list:
  - model_name: deepseek-ai/DeepSeek-V4-Flash
    litellm_params:
      model: deepinfra/deepseek-ai/DeepSeek-V4-Flash
      api_key: os.environ/DEEPINFRA_API_KEY
      api_base: https://api.deepinfra.com/v1/openai
  - model_name: deepseek-ai/DeepSeek-V4.1-Flash-1017
    litellm_params:
      model: deepinfra/deepseek-ai/DeepSeek-V4.1-Flash-1017
      api_key: os.environ/DEEPINFRA_API_KEY
      api_base: https://api.deepinfra.com/v1/openai
  - model_name: XiaomiMiMo/MiMo-V2.6-Flash
    litellm_params:
      model: deepinfra/XiaomiMiMo/MiMo-V2.6-Flash
      api_key: os.environ/DEEPINFRA_API_KEY
      api_base: https://api.deepinfra.com/v1/openai
  - model_name: deepseek-ai/DeepSeek-V4-Pro-0813
    litellm_params:
      model: deepinfra/deepseek-ai/DeepSeek-V4-Pro-0813
      api_key: os.environ/DEEPINFRA_API_KEY
      api_base: https://api.deepinfra.com/v1/openai
  - model_name: XiaomiMiMo/MiMo-V2.6-Pro
    litellm_params:
      model: deepinfra/XiaomiMiMo/MiMo-V2.6-Pro
      api_key: os.environ/DEEPINFRA_API_KEY
      api_base: https://api.deepinfra.com/v1/openai

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  spend_tracking: true
  max_budget: 50.0  # Alpha safety cap: $50/month across all users to prevent runaway costs
  alerting: ["email"]  # Alert when 70% of max_budget is reached
